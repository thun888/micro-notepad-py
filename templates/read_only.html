{% extends "layout.html" %}

{% block status_text %}版本: {{ rev.version_num }} (只读){% endblock %}

{% block extra_nav %}
<a href="{{ url_for('view_revisions', note_id=note_id) }}" class="btn btn-outline-light btn-sm ms-3">返回历史记录</a>
{% endblock %}

{% block content %}
<div class="main-container mx-3 my-3">
  <div class="content-area h-100 border bg-white p-3" style="overflow-y: auto;">
    <div class="ql-editor ql-editor-preview">{{ content|safe }}</div>
  </div>
</div>
<style>
  .ql-editor-preview {
    padding: 12px 15px;
  }
  .ql-editor-preview img {
    max-width: 100%;
    height: auto;
  }
  .ql-editor-preview .attachment-card {
    max-width: 400px;
    cursor: pointer;
    text-decoration: none !important;
    color: inherit !important;
  }
  .ql-editor-preview .attachment-card:hover {
    background-color: #f8f9fa;
    color: inherit !important;
  }
  @media print {
    body > * { display: none !important; }
    .main-container { display: block !important; }
    .main-container .content-area { border: none !important; overflow: visible !important; }
    .ql-editor-preview { display: block !important; color: black; background: transparent; }
  }
</style>
{% endblock %}
